name: Build

on:
  push:
    branches: [main]
    # Trailing * permits PEP 440 prerelease/dev suffixes (a1, b2, rc1, .dev3).
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# ONNX Runtime version bundled on Linux and in the Windows CUDA variants. Must
# be a release chromadec builds against AND that publishes prebuilt tarballs on
# the ORT GitHub releases. Bump together with the chromadec pin. macOS ignores
# this (native CoreML, no ORT); the default Windows wheel bundles the Windows
# ML engine pinned by the ORT_WINML pair below instead.
#
# 1.27 is the floor for the GPU variants: it is where ORT started publishing a
# CUDA 13 package, and where both CUDA majors got explicit asset names
# (gpu_cuda12 / gpu_cuda13) in place of the single legacy "-gpu-" tarball.
#
# Two things to re-check whenever this moves:
#   - The TensorRT major the TRT EP loads. 1.28 wants libnvinfer.so.10, while an
#     unpinned tensorrt-cuXX from PyPI now installs 11.x, which it cannot use.
#   - microsoft/onnxruntime#29779. Since 1.27 the TRT EP tests the composite
#     NV_TENSORRT_VERSION against 11, which is true on every TensorRT 10, so it
#     never marks networks strongly typed. Harmless for us — our models are all
#     fp32, and with no precision flags TensorRT has only fp32 kernels either
#     way — but it is why a bundled fp16 model would decode slowly.
env:
  ORT_VERSION: "1.28.0"
  # MIGraphX comes from AMD, not Microsoft, and moves on ROCm's cadence rather
  # than ORT_VERSION's. onnxruntime-migraphx (not onnxruntime-rocm — that one
  # carries no MIGraphX EP) is published on ROCm's own manylinux index, built
  # for the matching ROCm release.
  ROCM_VERSION: "7.2.4"
  ORT_MIGRAPHX_VERSION: "1.23.2"
  # DirectML-capable ORT comes from the Windows ML lineage: the classic
  # Microsoft.ML.OnnxRuntime.DirectML packages froze at 1.24.4 on every
  # channel, while onnxruntime-windowsml (MIT, on PyPI) keeps shipping current
  # engines. This is the engine the default Windows wheel bundles — its CPU EP
  # serves machines without a usable DX12 device, so it replaces the plain CPU
  # build outright. The wheel pin carries a datestamp suffix on the engine
  # version; the plain version pins the release archive that supplies the
  # matching headers and import library. Bump the pair together, independently
  # of ORT_VERSION.
  ORT_WINML_VERSION: "1.27.1"
  ORT_WINML_WHEEL_VERSION: "1.27.1.202607110137"

jobs:
  # ---------------------------------------------------------------------------
  # VERSION.txt is the source of truth; this catches the copies that can't read
  # it, and on a tag, a tag that disagrees with it.
  # ---------------------------------------------------------------------------
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check version copies
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tools/check_version.sh "${GITHUB_REF_NAME}"
          else
            tools/check_version.sh
          fi

  # ---------------------------------------------------------------------------
  # Source distribution
  # ---------------------------------------------------------------------------
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build sdist
        run: pipx run build --sdist -o dist/
      - uses: actions/upload-artifact@v6
        with:
          name: vsanalog-sdist
          path: dist/*.tar.gz

  # The docs autodoc the Python wrapper with vapoursynth mocked out, so this
  # needs neither a build nor VapourSynth itself.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.docs.txt
      - name: Build documentation
        run: python -m sphinx -b html -W --keep-going docs docs/_build/html

  # Build the sdist the way a PyPI user would: no models, no vendored
  # subproject, no ONNX Runtime — just the wrap fetched over the network.
  sdist-build-check:
    needs: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: vsanalog-sdist
          path: dist/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # No libfftw3-dev on purpose: FFTW comes from the wrap, and this job is
      # what proves an sdist install needs nothing preinstalled to get it.
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config

      - name: Provide VapourSynth headers and pkg-config file
        run: |
          sudo mkdir -p /usr/include/vapoursynth /usr/lib/pkgconfig
          for h in VapourSynth4.h VSHelper4.h; do
            sudo curl -sSL "https://raw.githubusercontent.com/vapoursynth/vapoursynth/master/include/$h" \
              -o "/usr/include/vapoursynth/$h"
          done
          sudo tee /usr/lib/pkgconfig/vapoursynth.pc > /dev/null << 'VSPC'
          prefix=/usr
          includedir=${prefix}/include/vapoursynth
          libdir=${prefix}/lib

          Name: vapoursynth
          Description: VapourSynth
          Version: 74
          Cflags: -I${includedir}
          VSPC

      - name: Build and import from sdist
        run: |
          python -m venv .venv && . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install "vapoursynth>=76"
          # -Dep=none: the NN decoders need an ONNX Runtime the sdist can't
          # assume. Everything else must build from the wrap alone.
          python -m pip install -v dist/*.tar.gz -Csetup-args="-Dep=none"
          python -c "import vsanalog; vsanalog.requires_plugin(lambda: None)(); print('sdist build imports OK')"

  # ---------------------------------------------------------------------------
  # macOS — native CoreML, no ONNX Runtime. Models bundled as .mlpackage.
  # Published to PyPI.
  # ---------------------------------------------------------------------------
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: brew install meson ninja vapoursynth

      - name: Fetch NN models
        run: python3 tools/fetch_models.py

      # Configure once so the chromadec wrap (with its convert_coreml.py) is
      # fetched, then convert the ONNX models to CoreML .mlpackage bundles.
      - name: Fetch chromadec sources (wrap)
        run: |
          PKG_CONFIG_PATH="$(brew --prefix vapoursynth)/lib/pkgconfig" \
            meson setup build_probe -Dbuild_wheel=false || true

      - name: Convert models to CoreML
        run: |
          python3.11 -m venv .venv-coreml || python3 -m venv .venv-coreml
          .venv-coreml/bin/pip install --quiet coremltools onnx2torch torch onnx
          .venv-coreml/bin/python tools/convert_models_macos.py \
            --python .venv-coreml/bin/python \
            --convert-script subprojects/chromadec/scripts/convert_coreml.py

      - name: Build wheel
        run: |
          pip install delocate wheel build
          # FFTW and SQLite are already static subprojects; prefer_static keeps
          # anything else off the shared path, leaving only system libraries.
          pipx run build --wheel -o dist/ -Csetup-args="-Dprefer_static=true"
          delocate-wheel -w wheelhouse/ dist/*.whl
          python -m wheel tags --python-tag py3 --abi-tag none wheelhouse/*.whl --remove
        env:
          PKG_CONFIG_PATH: /opt/homebrew/lib/pkgconfig:/usr/local/lib/pkgconfig

      # Built separately from the wheel on purpose: delocate rewrites the
      # wheel's plugin to load vendored libraries from a sibling package
      # directory, so that copy can't be dropped into a VapourSynth plugins
      # directory on its own. This build links everything but the system
      # libraries and CoreML statically.
      - name: Build standalone plugin
        run: |
          meson setup build_tarball -Dbuild_wheel=false -Dprefer_static=true
          meson compile -C build_tarball
          otool -L build_tarball/vsanalog.dylib
        env:
          PKG_CONFIG_PATH: /opt/homebrew/lib/pkgconfig:/usr/local/lib/pkgconfig

      - name: Package plugin tarball
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION.txt)
          BASE="vsanalog-${VERSION}-macos-${{ matrix.arch }}"
          mkdir "${BASE}"
          cp build_tarball/vsanalog.dylib "${BASE}/"
          tar --uid 0 --gid 0 --exclude '.DS_Store' -cf - "${BASE}" | xz -9 -e -T1 > "${BASE}.tar.xz"

      - uses: actions/upload-artifact@v6
        with:
          name: vsanalog-wheel-macos-${{ matrix.arch }}
          path: wheelhouse/*.whl
      - uses: actions/upload-artifact@v6
        with:
          name: vsanalog-macos-${{ matrix.arch }}
          path: vsanalog-*.tar.xz

  # ---------------------------------------------------------------------------
  # Linux (manylinux) — CPU ONNX Runtime bundled by auditwheel. Published to PyPI.
  # ---------------------------------------------------------------------------
  build-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
            manylinux: quay.io/pypa/manylinux_2_28_x86_64
            ort: onnxruntime-linux-x64
          - runner: ubuntu-24.04-arm
            arch: aarch64
            manylinux: quay.io/pypa/manylinux_2_34_aarch64
            ort: onnxruntime-linux-aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - name: Fetch NN models
        run: python3 tools/fetch_models.py

      - name: Build manylinux wheel and standalone plugin
        run: |
          mkdir -p wheelhouse plugin-out
          docker run --rm \
            -e ORT_VERSION="${ORT_VERSION}" \
            -e ORT_PKG="${{ matrix.ort }}" \
            -e ARCH="${{ matrix.arch }}" \
            -v "${{ github.workspace }}:/src:ro" \
            -v "${{ github.workspace }}/wheelhouse:/wheelhouse" \
            -v "${{ github.workspace }}/plugin-out:/out" \
            ${{ matrix.manylinux }} \
            bash -exc '
          PYBIN="/opt/python/cp312-cp312/bin"; export PATH="${PYBIN}:${PATH}"
          # No fftw-devel and no sqlite-devel: both come from wraps built into
          # the plugin. Fedora ships no NEON codelets on aarch64 and no AVX2 on
          # x86_64, which is the reason FFTW is built here rather than installed.
          dnf install -y gcc-c++ pkg-config git

          # ONNX Runtime (CPU) prebuilt: headers + shared lib.
          curl -sSL "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/${ORT_PKG}-${ORT_VERSION}.tgz" -o /tmp/ort.tgz
          mkdir -p /opt/ort && tar -xzf /tmp/ort.tgz -C /opt/ort --strip-components=1
          export LD_LIBRARY_PATH="/opt/ort/lib:${LD_LIBRARY_PATH}"

          mkdir -p /usr/include/vapoursynth
          curl -sSL https://raw.githubusercontent.com/vapoursynth/vapoursynth/master/include/VapourSynth4.h -o /usr/include/vapoursynth/VapourSynth4.h
          curl -sSL https://raw.githubusercontent.com/vapoursynth/vapoursynth/master/include/VSHelper4.h -o /usr/include/vapoursynth/VSHelper4.h
          cat > /usr/lib64/pkgconfig/vapoursynth.pc << VSPC
          prefix=/usr
          includedir=\${prefix}/include/vapoursynth
          libdir=\${prefix}/lib64

          Name: vapoursynth
          Description: VapourSynth
          Version: 74
          Cflags: -I\${includedir}
          VSPC

          python3 -m pip install --quiet "meson!=1.11.0" ninja meson-python build auditwheel wheel

          cp -a /src /tmp/build && cd /tmp/build
          python3 -m build --wheel --no-isolation -o /tmp/dist/ \
            -Csetup-args="-Dep=cpu" \
            -Csetup-args="-Dprefer_static=true" \
            -Csetup-args="-Dchromadec:onnxruntime_root=/opt/ort"

          # An x86-64-v3 variant, which VapourSynth loads only on CPUs that
          # report the matching ABI level. Built with clang rather than the gcc
          # used above: measured on Zen 4, clang wins clearly once AVX2 is
          # enabled, but is ~17% SLOWER than gcc on pal2d at the baseline ISA,
          # so the fallback binary every older CPU gets stays on gcc.
          # The probe is x86-only, so aarch64 ships a single binary.
          if [ "${ARCH}" = "x86_64" ]; then
            dnf install -y clang
            CC=clang CXX=clang++ meson setup /tmp/bv3 -Dbuild_wheel=false \
              -Dep=cpu -Dprefer_static=true -Dchromadec:onnxruntime_root=/opt/ort \
              -Dcpp_args=-march=x86-64-v3 -Dc_args=-march=x86-64-v3
            meson compile -C /tmp/bv3
            # Before auditwheel: it renames the vendored libraries and patches
            # the importing binaries, so a variant added after would still
            # reference the unmangled sonames.
            python3 tools/add_cpu_tiers.py /tmp/dist/*.whl /tmp/tiered/ \
              --tier avx2=/tmp/bv3/vsanalog.so
            rm -f /tmp/dist/*.whl && mv /tmp/tiered/*.whl /tmp/dist/
          fi

          auditwheel repair -w /wheelhouse/ /tmp/dist/*.whl
          python3 -m wheel tags --python-tag py3 --abi-tag none /wheelhouse/*.whl --remove

          # Standalone plugin: auditwheel rewrites the wheel copy to load
          # vendored libraries from a sibling package directory, so the tarball
          # gets its own build instead. -Dep=none drops the ONNX Runtime link
          # (and with it the NN decoders) to keep the plugin a single file.
          meson setup /tmp/btar -Dbuild_wheel=false -Dep=none -Dprefer_static=true
          meson compile -C /tmp/btar
          readelf -d /tmp/btar/vsanalog.so | grep NEEDED
          cp /tmp/btar/vsanalog.so /out/
          '

      - name: Package plugin tarball
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION.txt)
          BASE="vsanalog-${VERSION}-linux-${{ matrix.arch }}"
          mkdir "${BASE}"
          cp plugin-out/vsanalog.so "${BASE}/"
          tar --owner=0 --group=0 -cf - "${BASE}" | xz -9 -e -T1 > "${BASE}.tar.xz"

      - uses: actions/upload-artifact@v6
        with:
          name: vsanalog-wheel-linux-${{ matrix.arch }}
          path: wheelhouse/*.whl
      - uses: actions/upload-artifact@v6
        with:
          name: vsanalog-linux-${{ matrix.arch }}
          path: vsanalog-*.tar.xz

  # ---------------------------------------------------------------------------
  # Linux GPU variants — Release-only (too large for PyPI).
  #   cuda     -> ORT GPU build (CUDA + TensorRT EPs) + native cuFFT pipeline
  #   migraphx -> AMD's ORT-MIGraphX build + native hipFFT pipeline
  # Both link the vendor toolkit for the device-resident pipeline, so both need
  # a real toolkit in the container, not just ONNX Runtime. The vendor runtime
  # is excluded from the wheel and must be present on the user's machine.
  #
  # CUDA ships as two variants because the toolkit major has to match the one
  # ORT's GPU build loads — our cuFFT kernels and ORT must agree on libcudart.
  # They are not interchangeable at the hardware level either: CUDA 13 dropped
  # offline compilation for Maxwell/Pascal/Volta, so the cuda12 wheel is the
  # only one that runs on pre-Turing cards.
  # NOTE: nothing here can exercise a GPU; the runners have none. This builds
  # and load-checks the wheel — attaching the EP needs a GPU validation job.
  # ---------------------------------------------------------------------------
  build-linux-gpu:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - ep: cuda
            variant: cuda12
            cuda_rpm_suffix: "12-8"
            cuda_home: /usr/local/cuda-12.8
            ort_gpu_pkg: gpu_cuda12
          - ep: cuda
            variant: cuda13
            cuda_rpm_suffix: "13-3"
            cuda_home: /usr/local/cuda-13.3
            ort_gpu_pkg: gpu_cuda13
          - ep: migraphx
            variant: migraphx
            cuda_rpm_suffix: ""
            cuda_home: ""
            ort_gpu_pkg: ""
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Fetch NN models
        run: python3 tools/fetch_models.py
      - name: Build manylinux GPU wheel (${{ matrix.variant }})
        run: |
          mkdir -p wheelhouse
          docker run --rm \
            -e ORT_VERSION="${ORT_VERSION}" -e EP="${{ matrix.ep }}" \
            -e VARIANT="${{ matrix.variant }}" \
            -e CUDA_RPM_SUFFIX="${{ matrix.cuda_rpm_suffix }}" \
            -e CUDA_HOME_DIR="${{ matrix.cuda_home }}" \
            -e ORT_GPU_PKG="${{ matrix.ort_gpu_pkg }}" \
            -e ROCM_VERSION="${ROCM_VERSION}" -e ORT_MIGRAPHX_VERSION="${ORT_MIGRAPHX_VERSION}" \
            -v "${{ github.workspace }}:/src:ro" \
            -v "${{ github.workspace }}/wheelhouse:/wheelhouse" \
            quay.io/pypa/manylinux_2_28_x86_64 \
            bash -exc '
          PYBIN="/opt/python/cp312-cp312/bin"; export PATH="${PYBIN}:${PATH}"
          dnf install -y gcc-c++ pkg-config git

          mkdir -p /usr/include/vapoursynth
          curl -sSL https://raw.githubusercontent.com/vapoursynth/vapoursynth/master/include/VapourSynth4.h -o /usr/include/vapoursynth/VapourSynth4.h
          curl -sSL https://raw.githubusercontent.com/vapoursynth/vapoursynth/master/include/VSHelper4.h -o /usr/include/vapoursynth/VSHelper4.h
          cat > /usr/lib64/pkgconfig/vapoursynth.pc << VSPC
          prefix=/usr
          includedir=\${prefix}/include/vapoursynth
          libdir=\${prefix}/lib64

          Name: vapoursynth
          Description: VapourSynth
          Version: 74
          Cflags: -I\${includedir}
          VSPC

          python3 -m pip install --quiet "meson!=1.11.0" ninja meson-python build auditwheel wheel

          # ── Vendor toolkit + ONNX Runtime ────────────────────────────────
          # EXCLUDE_ARGS is what auditwheel must NOT vendor: the vendor runtime
          # the user installs themselves. Without it, a repaired wheel swells by
          # hundreds of megabytes of CUDA/ROCm libraries.
          if [ "${EP}" = "cuda" ]; then
            cat > /etc/yum.repos.d/cuda.repo << REPO
          [cuda]
          name=CUDA
          baseurl=https://developer.download.nvidia.com/compute/cuda/repos/rhel8/x86_64
          enabled=1
          gpgcheck=0
          REPO
            dnf install -y "cuda-nvcc-${CUDA_RPM_SUFFIX}" \
                           "cuda-cudart-devel-${CUDA_RPM_SUFFIX}" \
                           "libcufft-devel-${CUDA_RPM_SUFFIX}"
            # Meson reads CUDA_PATH for the toolkit and needs nvcc on PATH for
            # add_languages("cuda"); the RPMs put neither in the default place.
            export CUDA_PATH="${CUDA_HOME_DIR}"
            export PATH="${CUDA_HOME_DIR}/bin:${PATH}"
            VENDOR_LIB_DIR="${CUDA_HOME_DIR}/lib64"
            EXCLUDE_ARGS=(--exclude "libcudart.so*" --exclude "libcublas*.so*"
                          --exclude "libcufft*.so*" --exclude "libcudnn*.so*"
                          --exclude "libnvinfer*.so*" --exclude "libnvrtc*.so*")

            curl -sSL "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-linux-x64-${ORT_GPU_PKG}-${ORT_VERSION}.tgz" -o /tmp/ort.tgz
            mkdir -p /opt/ort && tar -xzf /tmp/ort.tgz -C /opt/ort --strip-components=1
          else
            cat > /etc/yum.repos.d/rocm.repo << REPO
          [rocm]
          name=ROCm
          baseurl=https://repo.radeon.com/rocm/rhel8/${ROCM_VERSION}/main
          enabled=1
          gpgcheck=0
          REPO
            # migraphx-devel carries libmigraphx_c, which the ORT MIGraphX
            # provider links; hipfft-devel and rocm-hip-runtime-devel cover
            # hipcc + hipFFT + hip::host for the native pipeline.
            dnf install -y rocm-hip-runtime-devel hipfft-devel migraphx-devel
            export PATH="/opt/rocm/bin:${PATH}"
            VENDOR_LIB_DIR="/opt/rocm/lib"
            EXCLUDE_ARGS=(--exclude "libamdhip64.so*" --exclude "libhipfft.so*"
                          --exclude "librocfft*.so*" --exclude "libmigraphx*.so*"
                          --exclude "libMIOpen.so*" --exclude "libamd_comgr.so*"
                          --exclude "libhsa-runtime64.so*" --exclude "librocblas.so*"
                          --exclude "libhsakmt.so*")

            # AMD ships ONNX Runtime as a Python wheel: shared objects under
            # onnxruntime/capi/ and no headers at all. chromadec resolves
            # -Donnxruntime_root as <root>/lib + <root>/include, so assemble
            # one from Microsoft's same-version CPU tarball (headers) and AMD
            # objects (libraries). The MIGraphX attach goes through the generic
            # AppendExecutionProvider entry point, so no MIGraphX-specific
            # header is involved and the stock headers suffice.
            curl -sSL "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_MIGRAPHX_VERSION}/onnxruntime-linux-x64-${ORT_MIGRAPHX_VERSION}.tgz" -o /tmp/ort.tgz
            mkdir -p /opt/ort && tar -xzf /tmp/ort.tgz -C /opt/ort --strip-components=1
            python3 -m pip install --quiet --no-deps --target /tmp/ortwheel \
              "onnxruntime-migraphx==${ORT_MIGRAPHX_VERSION}" \
              -f "https://repo.radeon.com/rocm/manylinux/rocm-rel-${ROCM_VERSION}/"
            rm -f /opt/ort/lib/libonnxruntime*.so*
            cp -a /tmp/ortwheel/onnxruntime/capi/libonnxruntime*.so* /opt/ort/lib/
            ln -sf "libonnxruntime.so.${ORT_MIGRAPHX_VERSION}" /opt/ort/lib/libonnxruntime.so
          fi
          export LD_LIBRARY_PATH="/opt/ort/lib:${VENDOR_LIB_DIR}:${LD_LIBRARY_PATH}"

          cp -a /src /tmp/build && cd /tmp/build
          python3 -m build --wheel --no-isolation -o /tmp/dist/ \
            -Csetup-args="-Dep=${EP}" \
            -Csetup-args="-Dprefer_static=true" \
            -Csetup-args="-Dchromadec:onnxruntime_root=/opt/ort"

          # No `|| auditwheel repair` fallback: a retry without --exclude
          # succeeds by vendoring the entire vendor runtime, which is both the
          # multi-gigabyte wheel we are avoiding and invisible in a green log.
          auditwheel repair "${EXCLUDE_ARGS[@]}" -w /wheelhouse/ /tmp/dist/*.whl
          # Retag so the variant does not collide with the PyPI wheel. A PEP 427
          # build tag (digits first) keeps the filename installable by pip; a
          # bare "-cuda" suffix does not parse as a wheel name at all.
          python3 -m wheel tags --python-tag py3 --abi-tag none --build "0${VARIANT}" /wheelhouse/*.whl --remove

          # ORT dlopens its execution providers rather than linking them, so
          # auditwheel never sees them and the repaired wheel would carry the
          # runtime with no provider to attach. CUDA wheels also get
          # $ORIGIN-relative RUNPATH entries for the pip nvidia/tensorrt
          # directories on the injected providers and the plugin, so their
          # link-time vendor deps resolve from pip packages even when no
          # preload ran (RUNPATH ranks below LD_LIBRARY_PATH, so a system
          # runtime keeps winning in that flow). Union of the cu12 and cu13
          # pip layouts; the loader skips directories that do not exist.
          GPU_DIRS_ARGS=()
          if [ "${EP}" = "cuda" ]; then
            GPU_DIRS_ARGS=(--gpu-runtime-dirs "nvidia/cu13/lib:nvidia/cuda_runtime/lib:nvidia/cuda_nvrtc/lib:nvidia/cublas/lib:nvidia/cufft/lib:nvidia/curand/lib:nvidia/cudnn/lib:tensorrt_libs")
          fi
          for w in /wheelhouse/*.whl; do
            python3 tools/inject_ort_providers.py "$w" /opt/ort/lib/libonnxruntime_providers_*.so "${GPU_DIRS_ARGS[@]}"
          done

          # Declare the pip vendor-runtime sets as [cuda]/[tensorrt] extras.
          # The requirement sets live in tools/add_variant_extras.py, keyed by
          # variant; meson-python cannot vary Requires-Dist per build, so they
          # are stamped into the finished wheel.
          if [ "${EP}" = "cuda" ]; then
            python3 tools/add_variant_extras.py /wheelhouse/*.whl --variant "${VARIANT}"
          fi

          # Load check. The vendor runtime is excluded from the wheel, so the
          # loader needs it on the path here exactly as a user would.
          python3 -m pip install --quiet "vapoursynth>=76" pytest
          python3 -m pip install --quiet /wheelhouse/*.whl
          python3 tools/check_wheel_plugin.py
          python3 -m pytest -v tests/test_autoload.py

          # Pip-flow load checks: with LD_LIBRARY_PATH gone, the plugin
          # link-time CUDA deps must resolve from pip nvidia wheels — once
          # through the .pth preload, once (preload disabled) through the
          # RUNPATH entries alone. No GPU needed; nothing calls cuInit at
          # plugin load.
          if [ "${EP}" = "cuda" ]; then
            # The runtime comes in through the wheel's own [cuda] extra, so a
            # drifted pin set fails this leg instead of a user install. This
            # also puts a full cuDNN layout on disk, which the preload-table
            # check needs: cuDNN's sublibraries are dlopened by soname at
            # runtime, so table coverage of them can only be checked against a
            # real pip layout. [tensorrt] is metadata-only in CI — its libs
            # are a multi-gigabyte install-time fetch from pypi.nvidia.com.
            w=$(ls /wheelhouse/*.whl)
            python3 -m pip install --quiet --no-cache-dir "vsanalog[cuda] @ file://${w}"

            # The preload table must cover every vendor soname the shipped
            # binaries link, plus every member of a dlopened family the pip
            # packages ship; an ORT or cuDNN bump that changes either fails
            # here, not silently on user machines.
            python3 tools/check_gpu_preload_table.py
            env -u LD_LIBRARY_PATH python3 tools/check_wheel_plugin.py
            env -u LD_LIBRARY_PATH VSANALOG_GPU_RUNTIME=off python3 tools/check_wheel_plugin.py
            env -u LD_LIBRARY_PATH python3 -m pytest -v tests/test_autoload.py
          fi
          '
      - uses: actions/upload-artifact@v6
        with:
          name: vsanalog-wheel-linux-x86_64-${{ matrix.variant }}
          path: wheelhouse/*.whl

  # ---------------------------------------------------------------------------
  # Windows x64 — CPU ONNX Runtime. Published to PyPI.
  # ---------------------------------------------------------------------------
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Use clang-cl
        shell: pwsh
        run: |
          # MSVC's vectoriser declines libchromadec's decoder loops at every
          # setting tried (/arch:AVX2, /fp:fast, __restrict); clang-cl takes
          # them. It needs the MSVC environment above for headers and libs.
          # FP model is left at the default /fp:precise.
          $llvm = "C:\Program Files\LLVM\bin"
          if (-not (Test-Path "$llvm\clang-cl.exe")) { choco install llvm -y --no-progress }
          "$llvm" | Out-File -FilePath $env:GITHUB_PATH -Append
          "CC=clang-cl"  | Out-File -FilePath $env:GITHUB_ENV -Append
          "CXX=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Append
          & "$llvm\clang-cl.exe" --version
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Meson and Ninja
        run: pip install "meson!=1.11.0" ninja
      - name: Install pkg-config
        run: choco install pkgconfiglite --allow-empty-checksums
      # No vcpkg step: FFTW was its only package and now comes from
      # subprojects/fftw3.wrap, built static with SSE2/AVX/AVX2 codelets, so the
      # wheel and the standalone plugin share one recipe. SQLite likewise comes
      # from libchromadec's bundled overlay.
      - name: Fetch NN models
        run: python tools/fetch_models.py

      # The wheel bundles the DML-capable engine from the Windows ML lineage:
      # onnxruntime.dll (CPU and DirectML EPs built in, so machines without a
      # usable DX12 device still decode) with DirectML.dll beside it, both
      # harvested from the MIT-licensed onnxruntime-windowsml wheel. Not the
      # Windows ML NuGet, whose proprietary license terms rule out
      # redistribution inside this GPL wheel; not the classic DirectML NuGet,
      # which is frozen at ORT 1.24.4 on every channel. Headers and the import
      # library come from the same-version plain release archive: the wheel
      # carries neither, and the generic AppendExecutionProvider("DML") attach
      # needs no DML-specific header, so the stock ones suffice.
      #
      # chromadec resolves -Donnxruntime_root as <root>/lib + <root>/include,
      # a shape neither artifact has alone, so the root is assembled from
      # both. Left unassembled the library lookup just fails, has_ort goes
      # false, and the wheel ships with no neural-network decoders at all and
      # no error.
      - name: Install ONNX Runtime (Windows ML engine)
        shell: pwsh
        run: |
          $ort = "onnxruntime-win-x64-$env:ORT_WINML_VERSION"
          Invoke-WebRequest "https://github.com/microsoft/onnxruntime/releases/download/v$env:ORT_WINML_VERSION/$ort.zip" -OutFile ort.zip
          Expand-Archive ort.zip -DestinationPath ort_extract
          pip download "onnxruntime-windowsml==$env:ORT_WINML_WHEEL_VERSION" --no-deps --only-binary=:all: -d winml_wheel
          $whl = Get-ChildItem winml_wheel/*.whl | Select-Object -First 1
          python -m zipfile -e $whl.FullName winml_wheel/unpacked

          $root = "$PWD/ort_root"
          New-Item -ItemType Directory -Force -Path "$root/lib" | Out-Null
          Copy-Item -Recurse "$PWD/ort_extract/$ort/include" "$root/include"
          Copy-Item "$PWD/ort_extract/$ort/lib/onnxruntime.lib" "$root/lib/"
          Copy-Item "winml_wheel/unpacked/onnxruntime/capi/onnxruntime.dll" "$root/lib/"
          Copy-Item "winml_wheel/unpacked/onnxruntime/capi/DirectML.dll" "$root/lib/"
          "ORT_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Download VapourSynth SDK
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/vapoursynth/vapoursynth/releases/download/R70/VapourSynth64-Portable-R70.zip" -OutFile vs.zip
          Expand-Archive vs.zip -DestinationPath vs_sdk

      - name: Create pkg-config files
        shell: pwsh
        run: |
          $pkgConfigDir = "pkgconfig"; New-Item -ItemType Directory -Force -Path $pkgConfigDir | Out-Null
          $workspacePath = "${{ github.workspace }}".Replace('\', '/')
          @"
          prefix=$workspacePath/vs_sdk
          includedir=`${prefix}/sdk/include/vapoursynth
          libdir=`${prefix}

          Name: vapoursynth
          Description: VapourSynth
          Version: 70
          Cflags: -I`${includedir}
          "@ | Out-File -FilePath "$pkgConfigDir/vapoursynth.pc" -Encoding ASCII -NoNewline

      - name: Build wheel
        shell: pwsh
        run: |
          $env:PKG_CONFIG_PATH = "${{ github.workspace }}/pkgconfig"
          pip install delvewheel wheel build
          python -m build --wheel -o dist/ `
            -Csetup-args="-Dep=directml" `
            -Csetup-args="-Dchromadec:onnxruntime_root=$env:ORT_ROOT"

      # A whole second build at /arch:AVX2. clang-cl vectorises libchromadec's
      # decoder loops that MSVC declines, but only with the wider ISA enabled —
      # at the default baseline it is no faster than MSVC. VapourSynth loads
      # this variant only on CPUs that report the matching ABI level.
      - name: Build the AVX2 variant
        shell: pwsh
        run: |
          $env:PKG_CONFIG_PATH = "${{ github.workspace }}/pkgconfig"
          meson setup build_avx2 -Dbuild_wheel=false `
            -Dep=directml -Dchromadec:onnxruntime_root="$env:ORT_ROOT" `
            -Dcpp_args=/arch:AVX2 -Dc_args=/arch:AVX2
          meson compile -C build_avx2

      - name: Repair wheel
        shell: pwsh
        run: |
          # Inject the variant BEFORE delvewheel: it renames the vendored DLLs
          # and patches the importing binaries, so a variant added afterwards
          # would still reference the unmangled names and fail to load.
          $wheel = Get-ChildItem dist/*.whl | Select-Object -First 1
          python tools/add_cpu_tiers.py $wheel tiered/ --tier avx2=build_avx2/vsanalog.dll
          $wheel = Get-ChildItem tiered/*.whl | Select-Object -First 1
          # --namespace-pkg must name the plugin's own directory too, or
          # delvewheel mints an __init__.py inside it.
          #
          # The Windows ML engine is monolithic — its EPs live inside
          # onnxruntime.dll — so DirectML.dll is the only library it reaches
          # for at runtime: a delay-load by exact name, so delvewheel must
          # vendor it (--add-dll) and may not rename it (--no-mangle).
          #
          # ext-ms-win-gdi-internal-uap-init-l1-1-0.dll is a Windows API Set:
          # a virtual name the OS loader resolves itself, never a real file on
          # disk, so delvewheel's dependency walker can't find it and needs to
          # be told to stop looking. D3D12/DXCore/dxgi are genuine OS
          # components onnxruntime.dll delay-loads; vendoring them means
          # delvewheel mangles their names and, to keep DirectML.dll working,
          # patches its own delay-import table in place — which corrupts it
          # enough to crash onnxruntime.dll on first use, CPU and DirectML EP
          # alike. Excluding them keeps DirectML.dll byte-identical to the
          # working upstream copy.
          delvewheel repair --analyze-existing `
            --namespace-pkg "vapoursynth;vapoursynth.plugins;vapoursynth.plugins.vsanalog" `
            --add-dll "DirectML.dll" --no-mangle "DirectML.dll" `
            --exclude "ext-ms-win-gdi-internal-uap-init-l1-1-0.dll;D3D12.dll;DXCore.dll;dxgi.dll" `
            --add-path "$env:ORT_ROOT/lib" $wheel -w repaired/

      - name: Co-locate bundled DLLs with the plugin
        shell: pwsh
        run: |
          # delvewheel vendors the dependency DLLs into a top-level
          # vsanalog.libs/ reachable only via an `import vsanalog` patch, which
          # VapourSynth's plugin autoloader never runs. Move them next to
          # vsanalog.dll so the loader resolves them directly.
          $repaired = Get-ChildItem repaired/*.whl | Select-Object -First 1
          python tools/colocate_plugin_libs.py $repaired wheelhouse/
          python -m wheel tags --python-tag py3 --abi-tag none (Get-ChildItem wheelhouse/*.whl) --remove

      # Separate from the wheel: delvewheel renames and relocates the DLLs the
      # wheel's plugin loads, so that copy only works inside the package. FFTW is
      # static either way now, so this differs only in dropping ONNX Runtime,
      # leaving a lone DLL that needs nothing but VapourSynth and the MSVC runtime.
      - name: Build standalone plugin
        shell: pwsh
        run: |
          $env:PKG_CONFIG_PATH = "${{ github.workspace }}/pkgconfig"
          meson setup build_tarball -Dbuild_wheel=false -Dep=none -Dprefer_static=true
          meson compile -C build_tarball

      - name: Package plugin tarball
        shell: pwsh
        run: |
          $VERSION = (Get-Content VERSION.txt -Raw).Trim()
          $BASE = "vsanalog-${VERSION}-windows-x64"
          New-Item -ItemType Directory -Path $BASE | Out-Null
          Copy-Item build_tarball/vsanalog.dll "$BASE/"
          tar --uid 0 --gid 0 -cf "$BASE.tar" $BASE
          python -c "import lzma,sys; i=sys.argv[1]; open(i+'.xz','wb').write(lzma.compress(open(i,'rb').read(),format=lzma.FORMAT_XZ,preset=9|lzma.PRESET_EXTREME))" "$BASE.tar"
          Remove-Item "$BASE.tar"

      - uses: actions/upload-artifact@v6
        with:
          name: vsanalog-wheel-windows-x64
          path: wheelhouse/*.whl
      - uses: actions/upload-artifact@v6
        with:
          name: vsanalog-windows-x64
          path: vsanalog-*.tar.xz

  # ---------------------------------------------------------------------------
  # Windows GPU variants — Release-only: the ORT GPU build (CUDA + TensorRT
  # EPs) plus the native cuFFT pipeline, as two toolkit-major variants for the
  # reason given on the Linux GPU job above. DirectML is not a variant: the
  # default Windows wheel bundles the DML-capable Windows ML engine (any DX12
  # GPU, CPU fallback built in).
  # NOTE: nothing here can exercise a GPU; the runners have none. This builds
  # and load-checks the wheel — attaching the EP needs a GPU validation job.
  # ---------------------------------------------------------------------------
  build-windows-gpu:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - ep: cuda
            variant: cuda12
            cuda_toolkit: '12.8.0'
            ort_pkg: onnxruntime-win-x64-gpu_cuda12
          - ep: cuda
            variant: cuda13
            cuda_toolkit: '13.2.0'
            ort_pkg: onnxruntime-win-x64-gpu_cuda13
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Use clang-cl
        shell: pwsh
        run: |
          # Matches the CPU wheel job; see the note there.
          $llvm = "C:\Program Files\LLVM\bin"
          if (-not (Test-Path "$llvm\clang-cl.exe")) { choco install llvm -y --no-progress }
          "$llvm" | Out-File -FilePath $env:GITHUB_PATH -Append
          "CC=clang-cl"  | Out-File -FilePath $env:GITHUB_ENV -Append
          "CXX=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Append
          & "$llvm\clang-cl.exe" --version
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install "meson!=1.11.0" ninja
      - run: choco install pkgconfiglite --allow-empty-checksums

      # -Dep=cuda maps to with_cuda=enabled, which compiles our own cuFFT
      # kernels and so needs nvcc and the CUDA libraries, not just ORT. Pinned
      # to the same major the matching ORT GPU build loads.
      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: ${{ matrix.cuda_toolkit }}
          method: 'network'
          sub-packages: '["nvcc", "cudart", "cufft", "cufft_dev", "visual_studio_integration"]'

      - name: Fetch NN models
        run: python tools/fetch_models.py

      - name: Install ONNX Runtime (${{ matrix.variant }})
        shell: pwsh
        run: |
          $ort = "${{ matrix.ort_pkg }}-$env:ORT_VERSION"
          Invoke-WebRequest "https://github.com/microsoft/onnxruntime/releases/download/v$env:ORT_VERSION/$ort.zip" -OutFile ort.zip
          Expand-Archive ort.zip -DestinationPath ort_extract
          $root = "$PWD/ort_extract/$ort"
          "ORT_EP_DLL_DIR=$root/lib" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ORT_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Download VapourSynth SDK
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/vapoursynth/vapoursynth/releases/download/R70/VapourSynth64-Portable-R70.zip" -OutFile vs.zip
          Expand-Archive vs.zip -DestinationPath vs_sdk
      - name: Create pkg-config files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path pkgconfig | Out-Null
          $workspacePath = "${{ github.workspace }}".Replace('\', '/')
          @"
          prefix=$workspacePath/vs_sdk
          includedir=`${prefix}/sdk/include/vapoursynth
          libdir=`${prefix}

          Name: vapoursynth
          Description: VapourSynth
          Version: 70
          Cflags: -I`${includedir}
          "@ | Out-File -FilePath "pkgconfig/vapoursynth.pc" -Encoding ASCII -NoNewline
      - name: Build wheel (${{ matrix.variant }})
        shell: pwsh
        run: |
          $env:PKG_CONFIG_PATH = "${{ github.workspace }}/pkgconfig"
          pip install delvewheel wheel build
          python -m build --wheel -o dist/ `
            -Csetup-args="-Dep=${{ matrix.ep }}" `
            -Csetup-args="-Dchromadec:onnxruntime_root=$env:ORT_ROOT"
          $wheel = Get-ChildItem dist/*.whl | Select-Object -First 1

          # ORT LoadLibrary's its execution providers by exact filename instead
          # of linking them, so delvewheel neither finds them (--add-dll) nor
          # may rename them (--no-mangle). The CUDA runtime is the user's to
          # install, so it is excluded rather than vendored.
          #
          # ext-ms-win-gdi-internal-uap-init-l1-1-0.dll is a Windows API Set: a
          # virtual name the OS loader resolves itself, never a real file on
          # disk, so delvewheel's dependency walker can't find it and needs to
          # be told to stop looking. Every EP hits this, not just CUDA's.
          $addDll = "onnxruntime_providers_shared.dll;onnxruntime_providers_cuda.dll;onnxruntime_providers_tensorrt.dll"
          # --exclude takes glob patterns, so these survive a CUDA minor bump.
          $exclude = "ext-ms-win-gdi-internal-uap-init-l1-1-0.dll;cudart64_*.dll;cufft64_*.dll;cublas*64_*.dll;cudnn*.dll;nvinfer*.dll"
          # --namespace-pkg must name the plugin's own directory too, or
          # delvewheel mints an __init__.py inside it.
          delvewheel repair --analyze-existing `
            --namespace-pkg "vapoursynth;vapoursynth.plugins;vapoursynth.plugins.vsanalog" `
            --add-dll $addDll --no-mangle $addDll `
            --exclude $exclude `
            --add-path "$env:ORT_EP_DLL_DIR" $wheel -w repaired/

          # delvewheel vendors the dependency DLLs into a top-level
          # vsanalog.libs/ reachable only via an `import vsanalog` patch, which
          # VapourSynth's plugin autoloader never runs. Move them next to
          # vsanalog.dll so the loader resolves them directly. ORT finds its
          # execution providers relative to onnxruntime.dll, so they move as a
          # set and stay together.
          $repaired = Get-ChildItem repaired/*.whl | Select-Object -First 1
          python tools/colocate_plugin_libs.py $repaired wheelhouse/

          # Build tag (digits first) rather than a "-cuda13" suffix, which
          # would make the filename unparseable and uninstallable by pip.
          python -m wheel tags --python-tag py3 --abi-tag none --build "0${{ matrix.variant }}" (Get-ChildItem wheelhouse/*.whl) --remove

          # Declare the pip vendor-runtime sets as [cuda]/[tensorrt] extras;
          # the requirement sets live in tools/add_variant_extras.py. Metadata
          # only on this leg — the Linux job installs through the extra to
          # exercise it.
          python tools\add_variant_extras.py (Get-ChildItem wheelhouse/*.whl).FullName --variant "${{ matrix.variant }}"

      # The vendor runtime is excluded from the CUDA wheel, so this also
      # confirms it resolves from a normal toolkit install rather than the
      # build tree. VapourSynth ignores plugins it cannot load, which is why
      # check_wheel_plugin.py asserts instead of skipping the way the test does.
      - name: Load check
        shell: pwsh
        run: |
          pip install "vapoursynth>=76" pytest
          pip install (Get-ChildItem wheelhouse/*.whl | Select-Object -First 1).FullName
          python tools/check_wheel_plugin.py
          python -m pytest -v tests/test_autoload.py

      - uses: actions/upload-artifact@v6
        with:
          name: vsanalog-wheel-windows-x64-${{ matrix.variant }}
          path: wheelhouse/*.whl

  # ---------------------------------------------------------------------------
  # Smoke tests — load the standalone plugin, then install the wheel and run
  # the test suite against it. The capture-backed tests skip without sample
  # media; the wrapper, autoload and wheel-layout tests always run.
  # ---------------------------------------------------------------------------
  smoke-test:
    needs: [build-macos, build-linux, build-windows]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            wheel: vsanalog-wheel-linux-x86_64
            tarball: vsanalog-linux-x86_64
          - runner: ubuntu-24.04-arm
            wheel: vsanalog-wheel-linux-aarch64
            tarball: vsanalog-linux-aarch64
          - runner: macos-14
            wheel: vsanalog-wheel-macos-arm64
            tarball: vsanalog-macos-arm64
          - runner: macos-15-intel
            wheel: vsanalog-wheel-macos-x86_64
            tarball: vsanalog-macos-x86_64
          - runner: windows-2022
            wheel: vsanalog-wheel-windows-x64
            tarball: vsanalog-windows-x64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v6
        with:
          name: ${{ matrix.wheel }}
          path: wheelhouse/
      - uses: actions/download-artifact@v6
        with:
          name: ${{ matrix.tarball }}
          path: tarballs/

      - name: Create test environment
        run: |
          python -m venv .venv
          if [ -d .venv/Scripts ]; then . .venv/Scripts/activate; else . .venv/bin/activate; fi
          python -m pip install --upgrade pip
          # numpy backs a couple of the pixel-level assertions; without it
          # those tests skip rather than fail.
          python -m pip install "vapoursynth>=76" pytest numpy

      # Before the wheel is installed: nothing else provides the namespace, so
      # a load failure here is the standalone plugin missing a runtime library.
      - name: Load the standalone plugin
        run: |
          if [ -d .venv/Scripts ]; then . .venv/Scripts/activate; else . .venv/bin/activate; fi
          python -c "import glob, tarfile; tarfile.open(glob.glob('tarballs/*.tar.xz')[0]).extractall('tarball_x')"
          python tools/check_standalone_plugin.py tarball_x

      - name: Install wheel
        run: |
          if [ -d .venv/Scripts ]; then . .venv/Scripts/activate; else . .venv/bin/activate; fi
          python -m pip install wheelhouse/*.whl

      # VapourSynth ignores plugins it cannot load, so tests/test_autoload.py
      # skips rather than fails when the installed wheel's plugin is unusable —
      # which is how a Windows wheel whose bundled DLLs the autoloader could not
      # resolve shipped green. This asserts instead. It has to run before
      # anything imports vsanalog: that import registers the DLL search path and
      # would mask the very failure being tested.
      - name: Load check (installed wheel)
        run: |
          if [ -d .venv/Scripts ]; then . .venv/Scripts/activate; else . .venv/bin/activate; fi
          python tools/check_wheel_plugin.py

      - name: Run tests
        env:
          # A wheel is installed here, so the layout checks assert rather than
          # skip the way they do in a source checkout.
          VSANALOG_CHECK_WHEEL_LAYOUT: '1'
        run: |
          if [ -d .venv/Scripts ]; then . .venv/Scripts/activate; else . .venv/bin/activate; fi
          pytest -v tests/

  # ---------------------------------------------------------------------------
  # Release — attach tarballs + ALL wheels (lean + GPU variants) to the tag.
  # ---------------------------------------------------------------------------
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    # Deliberately not waiting on the GPU jobs: their execution providers are
    # provisioned from third-party packages and a failure there must not hold
    # back the release of the platform wheels and plugins.
    needs: [version-check, sdist, sdist-build-check, smoke-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Explicit names: the GPU-variant artifacts may or may not exist yet, and
      # they are published by release-gpu-wheels below, not from here.
      - uses: actions/download-artifact@v6
        with:
          pattern: >-
            {vsanalog-sdist,vsanalog-wheel-macos-arm64,vsanalog-wheel-macos-x86_64,vsanalog-wheel-linux-x86_64,vsanalog-wheel-linux-aarch64,vsanalog-wheel-windows-x64,vsanalog-macos-arm64,vsanalog-macos-x86_64,vsanalog-linux-x86_64,vsanalog-linux-aarch64,vsanalog-windows-x64}
          path: artifacts
          merge-multiple: true

      - name: Attach lean wheels + tarballs + sdist to the Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          # The action's auto-detect only flags hyphen-suffixed (SemVer) tags
          # as prereleases; PEP 440's hyphen-less form (v1.0.0a1, v1.0.0b1,
          # v1.0.0rc1, v1.0.0.dev1) needs an explicit flag.
          prerelease: ${{ contains(github.ref_name, 'a') || contains(github.ref_name, 'b') || contains(github.ref_name, 'rc') || contains(github.ref_name, '.dev') }}
          files: |
            artifacts/*.tar.xz
            artifacts/*.whl
            artifacts/*.tar.gz

  # ---------------------------------------------------------------------------
  # GPU-variant wheels, added to the Release once they finish. Separate from the
  # release job so a provisioning failure on one of them can't hold back — or
  # race — the platform wheels and plugins.
  # ---------------------------------------------------------------------------
  release-gpu-wheels:
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    needs: [release, build-linux-gpu, build-windows-gpu]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Tolerates a variant that failed or was never built: whatever landed
      # gets attached, and the step below stops if that turns out to be nothing.
      - uses: actions/download-artifact@v6
        continue-on-error: true
        with:
          pattern: vsanalog-wheel-*-{cuda12,cuda13,migraphx}
          path: gpu-wheels
          merge-multiple: true

      - name: List what was built
        id: gpu
        run: |
          COUNT=$(find gpu-wheels -name '*.whl' 2>/dev/null | wc -l)
          echo "count=${COUNT}" >> "$GITHUB_OUTPUT"
          ls -lh gpu-wheels/ || true

      # These can brush against the 2 GiB per-asset GitHub Release limit, so
      # when GPU_WHEELS_S3_BUCKET is configured they go to S3 instead;
      # otherwise they land on the Release (fine while they stay under 2 GiB).
      - name: Upload GPU wheels to S3
        if: steps.gpu.outputs.count != '0' && vars.GPU_WHEELS_S3_BUCKET != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION }}
        run: |
          DEST="s3://${{ vars.GPU_WHEELS_S3_BUCKET }}/${{ vars.GPU_WHEELS_S3_PREFIX }}${GITHUB_REF_NAME}/"
          aws s3 cp gpu-wheels/ "$DEST" --recursive --acl public-read
          echo "GPU wheels uploaded to $DEST"

      - name: Attach GPU wheels to the Release
        if: steps.gpu.outputs.count != '0' && vars.GPU_WHEELS_S3_BUCKET == ''
        uses: softprops/action-gh-release@v2
        with:
          files: gpu-wheels/*.whl

  # ---------------------------------------------------------------------------
  # PyPI — lean wheels only (macOS CoreML, Linux CPU, Windows with the
  # DML-capable Windows ML engine). GPU variants are Release-only and never
  # published here.
  # ---------------------------------------------------------------------------
  publish-pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version-check, sdist, sdist-build-check, smoke-test]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: vsanalog-sdist
          path: dist/
      # Explicit lean-wheel names only: GPU-variant artifacts (…-0cuda12 /
      # …-0cuda13 / …-0migraphx) exist on the same tag run but must NOT be
      # published to PyPI.
      - uses: actions/download-artifact@v6
        with:
          pattern: >-
            {vsanalog-wheel-macos-arm64,vsanalog-wheel-macos-x86_64,vsanalog-wheel-linux-x86_64,vsanalog-wheel-linux-aarch64,vsanalog-wheel-windows-x64}
          path: dist/
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
